# UH2 AIM2 stop-signal task (BIDS label: stopSignal)
#
# Adapted from neuro_workflow stopSignal.yaml for Oak events:
#   - trial_id is ``stim`` (not ``test_trial``)
#   - TR = 0.68 s (680 ms; see uh2_aim2.config.FMRI_TRIGGER_TR_MS)
#   - Go correctness uses ``correct == 1`` (events lack ``correct_response``)
#   - Nuisance regressors use duration: 1 (events ``duration`` is unreliable ~0.639 s)
#
# Copy or symlink into neuro_workflow when running lev1:
#   neuro_workflow/src/neuro_workflow/analysis/task_config/tasks/stopSignal.yaml
#
# Preprocessing: ``define_nuisance_trials`` flags omission/commission/rt_too_fast on
# ``trial_type == 'go'``. If commission is always zero, add ``correct_response`` to
# events (or derive it in preprocess_events from ``correct`` / task rules).
#
# RT modeling — Mumford 2023 ConstDurRTDur: pooled ``response_time`` regressor on
# correct go trials only; stop_success / stop_failure are ConstDur-only.

tr: 0.68
dummy_scans: 0
min_rt: 0.2
expected_sessions: 1

regressors:
  go:
    amplitude: 1
    duration: 1
    subset: >-
      trial_id == 'stim' and trial_type == 'go' and correct == 1
      and response_time >= 0.2

  stop_success:
    amplitude: 1
    duration: 1
    subset: "trial_id == 'stim' and trial_type == 'stop_success'"

  stop_failure:
    amplitude: 1
    duration: 1
    subset: "trial_id == 'stim' and trial_type == 'stop_failure'"

  response_time:
    amplitude: 1
    duration: response_time
    subset: >-
      trial_id == 'stim' and trial_type == 'go' and correct == 1
      and response_time >= 0.2

  go_omission:
    amplitude: omission
    duration: 1
    subset: null

  go_commission:
    amplitude: commission
    duration: 1
    subset: null

  go_rt_fast:
    amplitude: rt_too_fast
    duration: 1
    subset: null

contrasts:
  go: "go"
  stop_success: "stop_success"
  stop_failure: "stop_failure"
  stop_success-go: "stop_success - go"
  stop_failure-go: "stop_failure - go"
  stop_success-stop_failure: "stop_success - stop_failure"
  stop_failure-stop_success: "stop_failure - stop_success"
  task: "1/3 * go + 1/3 * stop_failure + 1/3 * stop_success"
  task-baseline: "1/3 * go + 1/3 * stop_failure + 1/3 * stop_success"
  response_time: "response_time"
